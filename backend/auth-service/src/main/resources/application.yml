server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankdash_auth}
    username: ${SPRING_DATASOURCE_USERNAME:bankdash}
    password: ${SPRING_DATASOURCE_PASSWORD:bankdash123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379

jwt:
  secret: ${JWT_SECRET:bankdash-super-secret-jwt-key-2025-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}       # 24 hours
  refresh-expiration: 604800000                # 7 days

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bankdash: DEBUG
