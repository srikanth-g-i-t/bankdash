services:
  # ─── Infrastructure ────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: bankdash-postgres
    environment:
      POSTGRES_USER: bankdash
      POSTGRES_PASSWORD: bankdash123
      POSTGRES_DB: bankdash
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bankdash-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankdash"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bankdash-redis
    ports:
      - "6379:6379"
    networks:
      - bankdash-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: bankdash-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - bankdash-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: bankdash-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - bankdash-net

  # ─── Microservices ─────────────────────────────────────────────
  auth-service:
    build: ./backend/auth-service
    container_name: bankdash-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankdash_auth
      SPRING_DATASOURCE_USERNAME: bankdash
      SPRING_DATASOURCE_PASSWORD: bankdash123
      JWT_SECRET: bankdash-super-secret-jwt-key-2025-change-in-production
      JWT_EXPIRATION: 86400000
      SPRING_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bankdash-net

  account-service:
    build: ./backend/account-service
    container_name: bankdash-account
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankdash_accounts
      SPRING_DATASOURCE_USERNAME: bankdash
      SPRING_DATASOURCE_PASSWORD: bankdash123
      JWT_SECRET: bankdash-super-secret-jwt-key-2025-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bankdash-net

  transaction-service:
    build: ./backend/transaction-service
    container_name: bankdash-transaction
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankdash_transactions
      SPRING_DATASOURCE_USERNAME: bankdash
      SPRING_DATASOURCE_PASSWORD: bankdash123
      JWT_SECRET: bankdash-super-secret-jwt-key-2025-change-in-production
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ACCOUNT_SERVICE_URL: http://account-service:8082
    depends_on:
      - postgres
      - kafka
    networks:
      - bankdash-net

  notification-service:
    build: ./backend/notification-service
    container_name: bankdash-notification
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - bankdash-net

  api-gateway:
    build: ./backend/api-gateway
    container_name: bankdash-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
      JWT_SECRET: bankdash-super-secret-jwt-key-2025-change-in-production
    depends_on:
      - auth-service
      - account-service
      - transaction-service
    networks:
      - bankdash-net

  # ─── Frontend ──────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: bankdash-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - bankdash-net

volumes:
  postgres_data:

networks:
  bankdash-net:
    driver: bridge
